---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -rf .htaccess $DEPLOYPATH/
    - /bin/cp -rf *.html $DEPLOYPATH/
    - /bin/cp -rf assets $DEPLOYPATH/
    - /bin/cp -rf robots.txt $DEPLOYPATH/
    - /bin/cp -rf sitemap.xml $DEPLOYPATH/
