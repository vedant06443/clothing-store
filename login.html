<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Suyog Textile</title>

  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .auth-card {
      max-width: 460px;
      margin: 60px auto 100px;
      background: #FFF;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="desktop-header">
    <div class="container d-flex justify-content-between align-items-center py-3">
      <a href="index.html" class="navbar-logo">
        <img src="assets/images/logo.png" alt="Suyog Textile" height="42">
        <span class="brand-name ms-2">Suyog <span class="brand-highlight">Textile</span></span>
      </a>
      <a href="index.html" class="btn btn-sm btn-outline">&larr; Back to Store</a>
    </div>
  </header>

  <main class="container">
    <div class="auth-card">
      <div class="text-center mb-4">
        <span style="font-size:2.5rem;">🪷</span>
        <h2 style="font-family:var(--font-brand);margin:8px 0 4px;">Welcome Back</h2>
        <p class="text-muted small">Sign in to track orders, manage addresses, and access your wishlist.</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label class="form-label small fw-bold">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" required placeholder="name@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Password</label>
          <input type="password" id="loginPass" class="form-control" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3">Sign In &rarr;</button>

        <div class="p-3 mb-3 rounded" style="background:#FFFDF9;border:1px dashed var(--gold);">
          <div class="small fw-bold mb-2 text-primary">⚡ Quick Sign In:</div>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-sm btn-outline flex-grow-1" onclick="quickFill('customer')">Customer</button>
            <button type="button" class="btn btn-sm btn-gold flex-grow-1" onclick="quickFill('admin')">Admin Demo</button>
          </div>
        </div>

        <div class="text-center small text-muted">
          Don't have an account? <a href="register.html" class="fw-bold text-primary">Create Account</a>
        </div>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom">
      <p>© 2026 Suyog Textile. Authentic Indian Ethnic Wear.</p>
    </div>
  </footer>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/store.js"></script>
  <script>
    function quickFill(type) {
      if (type === 'admin') {
        document.getElementById('loginEmail').value = 'admin@suyogtextile.com';
        document.getElementById('loginPass').value = 'admin123';
      } else {
        document.getElementById('loginEmail').value = 'priya@example.com';
        document.getElementById('loginPass').value = 'customer123';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const isAdmin = email.includes('admin');

      const user = {
        name: isAdmin ? 'Store Administrator' : 'Priya Sharma',
        email: email,
        phone: '+91 86693 96037',
        isAdmin: isAdmin,
        loginDate: new Date().toLocaleDateString()
      };

      localStorage.setItem('suyog_auth_user', JSON.stringify(user));
      Store.showToast(`Welcome, ${user.name}!`);

      setTimeout(() => {
        if (isAdmin) {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'account.html';
        }
      }, 500);
    }
  </script>
</body>
</html>
