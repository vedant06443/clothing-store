<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — Suyog Textile</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪷</text></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .success-section {
      padding: 60px 0 100px;
    }
    .success-card {
      max-width: 720px;
      margin: 0 auto;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 40px;
      box-shadow: var(--shadow-md);
    }
    .success-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .success-check-icon {
      font-size: 3.5rem;
      color: var(--color-success);
      margin-bottom: 12px;
      display: inline-block;
    }
    .order-id-badge {
      display: inline-block;
      background: var(--color-gold-subtle);
      border: 1px dashed var(--color-gold);
      color: var(--color-primary);
      padding: 6px 16px;
      border-radius: var(--radius-full);
      font-weight: 700;
      margin-top: 12px;
    }
    .milestone-tracker {
      display: flex;
      justify-content: space-between;
      position: relative;
      margin: 36px 0;
    }
    .milestone-tracker::before {
      content: '';
      position: absolute;
      top: 18px;
      left: 10%;
      right: 10%;
      height: 3px;
      background: var(--color-border);
      z-index: 1;
    }
    .milestone-step {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .step-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #eee;
      color: #666;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      border: 2px solid #FFF;
    }
    .milestone-step.done .step-circle {
      background: var(--color-success);
      color: #FFF;
    }
    .milestone-step.active .step-circle {
      background: var(--color-primary);
      color: #FFF;
    }
    .step-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--color-text-muted);
    }
    .receipt-box {
      border: 1px solid var(--color-border-subtle);
      background: var(--color-surface-soft);
      border-radius: var(--radius-sm);
      padding: 20px;
      margin: 24px 0;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container nav-wrapper">
      <a href="index.html" class="logo-area">
        <span class="brand-symbol">🪷</span>
        <div class="brand-names">
          <span class="brand-main">SUYOG TEXTILE</span>
          <span class="brand-tag">Heirloom Ethnic Wear</span>
        </div>
      </a>
      <div class="nav-actions">
        <a href="shop.html" class="btn btn-outline btn-sm">Shop More</a>
      </div>
    </div>
  </header>

  <!-- Success Section -->
  <main class="success-section">
    <div class="container">
      <div class="success-card">
        <div class="success-header">
          <span class="success-check-icon">✓</span>
          <h1 style="font-size: 2rem; margin-bottom: 8px;">Order Confirmed!</h1>
          <p style="color: var(--color-text-muted);">Thank you for choosing Suyog Textile. Your order has been placed successfully.</p>
          <div class="order-id-badge" id="orderIdBadge">Order Confirmed</div>
        </div>

        <!-- Milestone tracker -->
        <div class="milestone-tracker">
          <div class="milestone-step done">
            <div class="step-circle">✓</div>
            <span class="step-label">Placed</span>
          </div>
          <div class="milestone-step active">
            <div class="step-circle">2</div>
            <span class="step-label">Confirmed</span>
          </div>
          <div class="milestone-step">
            <div class="step-circle">3</div>
            <span class="step-label">Dispatched</span>
          </div>
          <div class="milestone-step">
            <div class="step-circle">4</div>
            <span class="step-label">Delivered</span>
          </div>
        </div>

        <!-- Details -->
        <div class="receipt-box" id="receiptContent">
          <!-- Injected via JS -->
        </div>

        <div style="display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:28px;">
          <a href="account.html" class="btn btn-primary" style="padding:10px 20px;text-decoration:none;font-weight:600;">📦 View in My Orders</a>
          <button class="btn btn-whatsapp" onclick="sendWhatsAppConfirmation()" style="padding:10px 20px;">
            <i class="fa-brands fa-whatsapp me-1"></i> Send to WhatsApp
          </button>
          <a href="shop.html" class="btn btn-outline" style="padding:10px 20px;text-decoration:none;">Explore More Weaves</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-bottom" style="border:none; padding-top:0;">
      <div>&copy; 2026 Suyog Textile. Real-Time Indian Clothing.</div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="assets/js/products.js"></script>
  <script src="assets/js/store.js"></script>
  <script>
    let currentOrder = null;

    document.addEventListener('DOMContentLoaded', () => {
      try {
        currentOrder = JSON.parse(localStorage.getItem('suyog_last_order'));
      } catch(e) {}

      if (!currentOrder) {
        document.getElementById('receiptContent').innerHTML = `
          <p style="text-align:center;">No recent order found. <a href="shop.html" style="color:var(--color-primary);">Go to Shop</a></p>
        `;
        return;
      }

      document.getElementById('orderIdBadge').textContent = `Order ID: ${currentOrder.orderId}`;

      const rec = document.getElementById('receiptContent');
      rec.innerHTML = `
        <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-size:0.9rem;">
          <div><strong>Deliver to:</strong> ${currentOrder.customer.name} (${currentOrder.customer.phone})</div>
          <div><strong>Date:</strong> ${currentOrder.date}</div>
        </div>
        <div style="font-size:0.85rem; color:var(--color-text-muted); margin-bottom:16px;">
          ${currentOrder.customer.address}, ${currentOrder.customer.city}, ${currentOrder.customer.state} - ${currentOrder.customer.pin}
        </div>
        <div style="font-size:0.9rem; margin-bottom:8px;">
          <strong>Payment Mode:</strong> ${currentOrder.paymentMethod}
        </div>
        <hr style="border:none; border-top:1px solid var(--color-border); margin:12px 0;">
        <div style="display:flex; flex-direction:column; gap:8px;">
          ${currentOrder.cart.map(item => `
            <div style="display:flex; justify-content:space-between; font-size:0.9rem;">
              <span>${item.quantity}x ${item.name} (${item.size})</span>
              <strong>₹${(item.price * item.quantity).toLocaleString('en-IN')}</strong>
            </div>
          `).join('')}
        </div>
        <hr style="border:none; border-top:1px solid var(--color-border); margin:12px 0;">
        <div style="display:flex; justify-content:space-between; font-size:1.15rem; font-weight:700; color:var(--color-primary);">
          <span>Total Paid / Due:</span>
          <span>₹${currentOrder.totals.total.toLocaleString('en-IN')}</span>
        </div>
      `;
    });

    function sendWhatsAppConfirmation() {
      if (!currentOrder) return;
      const text = `*Namaste Suyog Textile!* I have placed order *${currentOrder.orderId}* for ₹${currentOrder.totals.total}. Please share tracking updates!`;
      window.open(`https://wa.me/918669396037?text=${encodeURIComponent(text)}`, '_blank');
    }
  </script>
</body>
</html>
