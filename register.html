<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Suyog Textile</title>

  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .auth-card {
      max-width: 480px;
      margin: 50px auto 100px;
      background: #FFF;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
  </style>
</head>
<body>

  <header class="desktop-header">
    <div class="container d-flex justify-content-between align-items-center py-3">
      <a href="index.html" class="navbar-logo">
        <img src="assets/images/logo.png" alt="Suyog Textile" height="42">
        <span class="brand-name ms-2">Suyog <span class="brand-highlight">Textile</span></span>
      </a>
      <a href="index.html" class="btn btn-sm btn-outline">&larr; Back to Store</a>
    </div>
  </header>

  <main class="container">
    <div class="auth-card">
      <div class="text-center mb-4">
        <span style="font-size:2.5rem;">🪷</span>
        <h2 style="font-family:var(--font-brand);margin:8px 0 4px;">Join Suyog Textile</h2>
        <p class="text-muted small">Unlock exclusive weaver drops, bridal lookbook access, and early festive deals.</p>
      </div>

      <form id="regForm" onsubmit="handleRegister(event)">
        <div class="mb-3">
          <label class="form-label small fw-bold">Full Name *</label>
          <input type="text" id="regName" class="form-control" required placeholder="e.g. Ananya Patel">
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Mobile Number *</label>
          <input type="tel" id="regPhone" class="form-control" required placeholder="e.g. 9812345678">
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Email Address *</label>
          <input type="email" id="regEmail" class="form-control" required placeholder="name@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Create Password *</label>
          <input type="password" id="regPass" class="form-control" required placeholder="At least 6 characters">
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3">Create Free Account &rarr;</button>

        <div class="text-center small text-muted">
          Already registered? <a href="login.html" class="fw-bold text-primary">Sign In here</a>
        </div>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom">
      <p>© 2026 Suyog Textile. Authentic Indian Ethnic Wear.</p>
    </div>
  </footer>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/store.js"></script>
  <script>
    function handleRegister(e) {
      e.preventDefault();
      const user = {
        name: document.getElementById('regName').value,
        phone: document.getElementById('regPhone').value,
        email: document.getElementById('regEmail').value,
        isAdmin: false,
        registeredDate: new Date().toLocaleDateString()
      };

      localStorage.setItem('suyog_auth_user', JSON.stringify(user));
      Store.showToast("Account created successfully!");
      setTimeout(() => { window.location.href = 'account.html'; }, 500);
    }
  </script>
</body>
</html>
