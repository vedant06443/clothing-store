services:
  - type: static
    name: suyogtextile
    staticPublishPath: ./public
    routes:
      - type: redirect
        source: /register.html
        destination: /login.html
      - type: redirect
        source: /orders.html
        destination: /account.html
      - type: redirect
        source: /order-detail.html
        destination: /account.html
      - type: redirect
        source: /invoice.html
        destination: /account.html
